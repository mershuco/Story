name: Reset published game

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare an empty website without game assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/empty-site"
          cat > "$RUNNER_TEMP/empty-site/404.html" <<'HTML'
          <!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>페이지 없음</title><p>게임이 초기화되었습니다.</p></html>
          HTML
      - name: Replace the published website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/empty-site
      - name: Publish the reset
        id: deployment
        uses: actions/deploy-pages@v4
