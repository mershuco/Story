name: Test and deploy LCK Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test game rules and match simulation
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.name == \"${PAGES_ARTIFACT}\" and .expired == false)] | length")"
            if [ "$count" -gt 0 ]; then
              echo "Pages artifact is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact metadata did not become available."
          exit 1
      # Use the uploaded artifact ID directly: the deploy action's artifact-name
      # lookup can lag behind the REST metadata endpoint after a successful upload.
      - name: Deploy
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          retries: 3
          script: |
            const repo = context.repo;
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Upload did not return a valid Pages artifact ID.');
            }
            const oidcToken = await core.getIDToken();
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: oidcToken
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentRoute = {...repo, deployment_id: deployment.id};
            const finalErrors = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data: result} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', deploymentRoute);
              core.info(`Pages deployment status: ${result.status}`);
              if (result.status === 'succeed') return;
              if (finalErrors.has(result.status)) throw new Error(`Pages deployment ended: ${result.status}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', deploymentRoute);
            throw new Error('Pages deployment timed out after 10 minutes.');
